<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Color Manager</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/color-manager.css">

</head>

<body>

    <!-- =========================
         MENÚ ADMIN
    ========================== -->

    <div id="menuAdmin"></div>

    <main class="contenido-admin">

        <!-- =========================
             ENCABEZADO
        ========================== -->

        <header class="encabezado-admin">

            <h1>🌈 Color Manager</h1>

            <p>
                Administra eventos, fan projects,
                fechas, zonas y colores.
            </p>

        </header>

        <!-- =========================
             VISTA PRINCIPAL
        ========================== -->

        <section class="color-home">

            <div class="card-evento-activo">

                <h2>
                    Evento activo
                </h2>

                <div id="eventoActivo">

                    No hay evento activo.

                </div>

                <button id="btnCrearEvento">

                    ＋ Crear nueva edición

                </button>

            </div>


            <div class="card-eventos">

                <div class="titulo-card">

                    <h2>

                        Ediciones

                    </h2>

                </div>

                <div id="listaEventos">

                </div>

            </div>

        </section>


        <!-- =========================
             VISTA DEL EVENTO
        ========================== -->

        <section
            id="vistaEvento"
            class="vista-evento"
            hidden
        >

            <button
                id="volverEventos"
                class="btn-volver"
            >

                ← Volver a eventos

            </button>


            <header class="evento-header">

                <h2 id="tituloEvento">

                    Evento

                </h2>

                <p>

                    Administra toda la configuración
                    de esta edición.

                </p>

            </header>


            <!-- =========================
                 MENÚ DEL EVENTO
            ========================== -->

            <nav class="tabs-manager">

                <button
                    class="tab-manager activa"
                    data-tab="fechas"
                >

                    📅 Fechas

                </button>

                <button
                    class="tab-manager"
                    data-tab="zonas"
                >

                    🪑 Zonas

                </button>

                <button
                    class="tab-manager"
                    data-tab="fanprojects"
                >

                    🌈 Fan Projects

                </button>

                <button
                    class="tab-manager"
                    data-tab="informacion"
                >

                    ⚙ Información

                </button>

            </nav>


            <!-- =========================
                 CONTENIDO DINÁMICO
            ========================== -->

            <section
                id="contenidoManager"
                class="contenido-manager"
            >

                <!--
                    Aquí el JavaScript cargará:

                    Fechas

                    Zonas

                    Fan Projects

                    Información
                -->

            </section>

        </section>

    </main>


    <!-- =========================
         JS
    ========================== -->

    <script src="js/menu.js"></script>
<script src="js/modulos/fechas.js"></script>
    <script src="js/color-manager.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Acceso Admin | HSMX OFFAN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8f4f1;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      margin-bottom: 30px;
      color: #666;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    #errorMessage {
      color: #c62828;
      margin-top: 15px;
      min-height: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Panel administrativo</h1>

    <p class="subtitle">
      Harry Styles México OFFAN
    </p>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Correo electrónico"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        Iniciar sesión
      </button>

    </form>

    <p id="errorMessage"></p>

  </div>

  <script type="module" src="admin.js"></script>

</body>
</html>

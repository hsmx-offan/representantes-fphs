<div
    id="modalRecuerdo"
    class="modal-recuerdo"
    aria-hidden="true"
>

    <div
        class="modal-recuerdo-fondo"
        data-cerrar-modal
    ></div>

    <div
        class="modal-recuerdo-contenido"
    >

        <button
            id="cerrarModalRecuerdo"
            class="cerrar-modal-recuerdo"
            type="button"
        >
            ✕
        </button>

        <div class="modal-recuerdo-grid">

            <div class="modal-galeria">

                <div class="modal-imagen-wrapper">

                    <img
                        id="modalRecuerdoImagen"
                        src=""
                        alt=""
                    >

                    <button
                        id="fotoAnterior"
                        class="control-foto anterior"
                        type="button"
                    >
                        ‹
                    </button>

                    <button
                        id="fotoSiguiente"
                        class="control-foto siguiente"
                        type="button"
                    >
                        ›
                    </button>

                </div>

                <p
                    id="contadorFotosModal"
                    class="contador-fotos-modal"
                >
                    1 / 1
                </p>

            </div>

            <div class="modal-recuerdo-info">

                <p class="etiqueta-seccion">
                    RECUERDO
                </p>

                <div class="modal-recuerdo-encabezado">

                    <div>

                        <h2 id="modalRecuerdoNombre">
                            —
                        </h2>

                        <p
                            id="modalRecuerdoInstagram"
                            class="modal-instagram"
                        >
                            —
                        </p>

                    </div>

                    <span
                        id="modalRecuerdoEstado"
                        class="recuerdo-estado pendiente"
                    >
                        Pendiente
                    </span>

                </div>

                <p
                    id="modalRecuerdoMensaje"
                    class="modal-recuerdo-mensaje"
                >
                    —
                </p>

                <div class="modal-recuerdo-datos">

                    <div>

                        <span>Concierto</span>

                        <strong
                            id="modalRecuerdoFecha"
                        >
                            —
                        </strong>

                    </div>

                    <div>

                        <span>Zona</span>

                        <strong
                            id="modalRecuerdoZona"
                        >
                            —
                        </strong>

                    </div>

                    <div>

                        <span>Fotografías</span>

                        <strong
                            id="modalRecuerdoCantidad"
                        >
                            —
                        </strong>

                    </div>

                </div>

                <div class="modal-recuerdo-acciones">

                    <button
                        id="modalAprobar"
                        class="modal-aprobar"
                        type="button"
                    >
                        Aprobar
                    </button>

                    <button
                        id="modalRechazar"
                        class="modal-rechazar"
                        type="button"
                    >
                        Rechazar
                    </button>

                    <button
                        id="modalDestacar"
                        class="modal-destacar"
                        type="button"
                    >
                        ⭐ Destacar
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Panel Admin | HSMX OFFAN</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f4f1;
      margin: 0;
      padding: 30px;
    }

    .panel {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout {
      background: #222;
      color: white;
    }

    #contenido {
      display: none;
    }

    #cargando {
      text-align: center;
      padding: 50px 0;
    }
  </style>
</head>

<body>

  <div class="panel">

    <div id="cargando">
      Verificando acceso...
    </div>

    <div id="contenido">

      <div class="topbar">
        <div>
          <h1>Panel administrativo</h1>
          <p>Generador de gafetes de representantes</p>
        </div>

        <button class="logout" onclick="logoutAdmin()">
          Cerrar sesión
        </button>
      </div>

      <hr>

      <p>
        Aquí vamos a colocar el buscador por ID y el generador de gafetes.
      </p>

    </div>

  </div>

  <script type="module">

    import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from
    "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_AUTH_DOMAIN",
      projectId: "TU_PROJECT_ID",
      storageBucket: "TU_STORAGE_BUCKET",
      messagingSenderId: "TU_MESSAGING_SENDER_ID",
      appId: "TU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const cargando = document.getElementById("cargando");
    const contenido = document.getElementById("contenido");

    onAuthStateChanged(auth, (user) => {

      if (user) {
        cargando.style.display = "none";
        contenido.style.display = "block";
      } else {
        window.location.href = "./";
      }

    });

    window.logoutAdmin = async function () {
      await signOut(auth);
      window.location.href = "./";
    };

  </script>

</body>
</html>

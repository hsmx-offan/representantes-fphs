<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>

  <script>
    const mantenimientoActivo = false;

    const params =
      new URLSearchParams(window.location.search);

    if (params.has("dev")) {
      localStorage.setItem("devMode", "1");
    }

    const modoDesarrollo =
      localStorage.getItem("devMode") === "1";

    if (
      mantenimientoActivo &&
      !modoDesarrollo
    ) {
      window.location.replace("mantenimiento.html");
    }
  </script>
<script>
  if (
    sessionStorage.getItem("accesoAdmin") === "1"
  ) {
    document.documentElement.classList.add(
      "acceso-admin-recordado"
    );
  }
</script>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gafetes | HSMX OFFAN</title>

  <link
    rel="stylesheet"
    href="css/panel.css"
  >

</head>

<body>

  <!-- =====================================
       CARGANDO
       ===================================== -->

  <div id="cargando">
    Verificando acceso...
  </div>


  <!-- =====================================
       CONTENIDO
       ===================================== -->

  <div
    id="contenido"
    style="display: none;"
  >

    <div class="app">

      <!-- =====================================
           ENCABEZADO
           ===================================== -->

      <header class="topbar">

        <div>

          <p class="eyebrow">
            HARRY STYLES MÉXICO OFFAN
          </p>

          <h1>
            Gafetes
          </h1>

          <p class="subtitulo">
            Generador y control de gafetes de representantes
          </p>
<p class="saludo-admin">
  Hola,
  <strong id="nombreAdmin">
    Admin
  </strong>
</p>
        </div>


        <div class="acciones-topbar">

          <button
            type="button"
            id="themeToggle"
            class="theme-toggle"
            aria-label="Cambiar tema"
            title="Cambiar tema"
          >
            ☀️
          </button>

          <button
            type="button"
            class="logout"
            id="logoutButton"
          >
            Cerrar sesión
          </button>

        </div>

      </header>


      <!-- =====================================
           MENÚ COMPARTIDO
           ===================================== -->

      <div id="menuAdmin"></div>


      <!-- =====================================
           GENERADOR
           ===================================== -->

      <section class="bloque">

        <div class="titulo-bloque">

          <div>

            <p class="etiqueta-seccion">
              GENERADOR
            </p>

            <h2>
              Generar gafete
            </h2>

            <p>
              Busca al representante por ID para generar su gafete.
            </p>

          </div>

        </div>


        <div class="generador">

          <!-- =====================================
               FORMULARIO
               ===================================== -->

          <div class="formulario">

            <h3>
              Buscar representante
            </h3>

            <label for="idRepresentante">
              ID del representante
            </label>

            <input
              type="text"
              id="idRepresentante"
              placeholder="Ej. FPHS-MX-002"
              autocomplete="off"
            >

            <button
              type="button"
              id="buscarRepresentante"
              class="boton-principal"
            >
              Buscar y generar
            </button>


            <div
              id="estado"
              class="estado"
            ></div>


            <!-- =====================================
                 DATOS ENCONTRADOS
                 ===================================== -->

            <div
              id="datosEncontrados"
              class="datos-encontrados"
              style="display: none;"
            >

              <p>
                <strong>Nombre:</strong>
                <span id="datoNombre"></span>
              </p>

              <p>
                <strong>ID:</strong>
                <span id="datoId"></span>
              </p>

            </div>


            <!-- =====================================
                 ESTADO DE ENVÍO
                 ===================================== -->

            <div
              id="estadoGafete"
              class="estado-gafete"
              style="display: none;"
            >

              <p class="etiqueta-seccion">
                CONTROL
              </p>

              <h3>
                Estado de envío
              </h3>

              <p
                id="textoEstadoGafete"
                class="texto-estado-gafete"
              ></p>

              <p
                id="detalleEstadoGafete"
                class="detalle-estado-gafete"
              ></p>

              <button
                type="button"
                id="cambiarEstadoGafete"
                class="cambiar-estado-gafete"
              >
                Marcar como enviado
              </button>

            </div>

          </div>


          <!-- =====================================
               VISTA PREVIA
               ===================================== -->

          <div class="preview">

            <div class="preview-encabezado">

              <p class="etiqueta-seccion">
                VISTA PREVIA
              </p>

              <h2>
                Gafete
              </h2>

            </div>


            <div class="gafete-wrapper">

              <img
                src="assets/images/gafete-base4.png"
                id="gafeteBase"
                alt="Gafete base"
              >

              <div
                id="textoNombre"
                class="dato nombre"
              ></div>

              <div
                id="textoId"
                class="dato id"
              ></div>

              <div
                id="qrContainer"
                class="qr-container"
              ></div>

            </div>


            <button
              type="button"
              id="descargarGafete"
              class="descargar-gafete"
            >
              Descargar gafete PNG
            </button>

          </div>

        </div>

      </section>

    </div>

  </div>


  <!-- =====================================
       QR
       ===================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
  ></script>


  <!-- =====================================
       MENÚ COMPARTIDO
       ===================================== -->

  <script
    type="module"
    src="js/shared/menu.js"
  ></script>


  <!-- =====================================
       PANEL
       ===================================== -->

  <script
    type="module"
    src="js/panel/index.js"
  ></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Panel Admin | HSMX OFFAN</title>
 <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f4f1;
      margin: 0;
      padding: 30px;
    }

    .panel {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout {
      background: #222;
      color: white;
    }

    #contenido {
      display: none;
    }

    #cargando {
      text-align: center;
      padding: 50px 0;
    }
.generador {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 30px;
  margin-top: 30px;
}

.formulario {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.formulario input {
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
}

.formulario button {
  margin-top: 10px;
  background: #222;
  color: white;
}

.preview {
  text-align: center;
}

.gafete-wrapper {
  position: relative;
  width: 100%;
  max-width: 520px;
  margin: auto;
}

#gafeteBase {
  width: 100%;
  display: block;
}

.dato {
  position: absolute;
  color: white;
  font-weight: 600;
  text-align: left;
  pointer-events: none;
}

/* Posiciones aproximadas */
.nombre {
  left: 35%;
  top: 52.2%;
  font-size: 24px;
}

.zona {
  left: 35%;
  top: 57%;
  font-size: 24px;
}

.id {
  left: 35%;
  top: 62%;
  font-size: 24px;
}

@media (max-width: 800px) {
  .generador {
    grid-template-columns: 1fr;
  }
}
  </style>

</head>

<body>

  <div class="panel">

    <div id="cargando">
      Verificando acceso...
    </div>

   <div id="contenido">

  <div class="topbar">
    <div>
      <h1>Panel administrativo</h1>
      <p>Generador de gafetes de representantes</p>
    </div>

    <button class="logout" id="logoutButton">
      Cerrar sesión
    </button>
  </div>

  <hr>

  <div class="generador">

    <div class="formulario">

      <h2>Generar gafete</h2>

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Ej. Evelyn Castillo">

      <label for="zona">Zona</label>
      <input type="text" id="zona" placeholder="Ej. General A">

      <label for="idRepresentante">ID</label>
      <input type="text" id="idRepresentante" placeholder="Ej. FPHS-MX-001">

      <button id="generarGafete">
        Generar vista previa
      </button>

    </div>

    <div class="preview">

      <h2>Vista previa</h2>

      <div class="gafete-wrapper">

        <img
          src="gafete-base.png"
          id="gafeteBase"
          alt="Gafete base"
        >

        <div id="textoNombre" class="dato nombre"></div>
        <div id="textoZona" class="dato zona"></div>
        <div id="textoId" class="dato id"></div>

      </div>

    </div>

  </div>

</div>
  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyAesU9F4Oc7Lr8TPOFUk-Oi-lT086XjRKw",

      authDomain:
        "hsmx-representantes.firebaseapp.com",

      projectId:
        "hsmx-representantes",

      storageBucket:
        "hsmx-representantes.firebasestorage.app",

      messagingSenderId:
        "821385801252",

      appId:
        "1:821385801252:web:c95ba9ffdeb90fe03732b1"

    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    const cargando =
      document.getElementById("cargando");

    const contenido =
      document.getElementById("contenido");

    const logoutButton =
      document.getElementById("logoutButton");


    onAuthStateChanged(auth, (user) => {

      if (user) {

        cargando.style.display = "none";

        contenido.style.display = "block";

      } else {

        window.location.href = "./";

      }

    });


    logoutButton.addEventListener(
      "click",
      async () => {

        await signOut(auth);

        window.location.href = "./";

      }
    );
const nombreInput = document.getElementById("nombre");
const zonaInput = document.getElementById("zona");
const idInput = document.getElementById("idRepresentante");

const textoNombre = document.getElementById("textoNombre");
const textoZona = document.getElementById("textoZona");
const textoId = document.getElementById("textoId");

const generarGafete = document.getElementById("generarGafete");

generarGafete.addEventListener("click", () => {

  textoNombre.textContent = nombreInput.value;
  textoZona.textContent = zonaInput.value;
  textoId.textContent = idInput.value;

});
  </script>

</body>
</html>

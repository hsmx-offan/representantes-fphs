<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Panel Admin | HSMX OFFAN</title>
 <link rel="stylesheet" href="panel.css">

</head>

<body>

  <div class="panel">

    <div id="cargando">
      Verificando acceso...
    </div>

   <div id="contenido">

  <div class="topbar">
    <div>
      <h1>Panel administrativo</h1>
      <p>Generador de gafetes de representantes</p>
    </div>

    <button class="logout" id="logoutButton">
      Cerrar sesión
    </button>
  </div>

  <hr>

  <div class="generador">

    <div class="formulario">

      <h2>Generar gafete</h2>

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Ej. Evelyn Castillo">

      <label for="zona">Zona</label>
      <input type="text" id="zona" placeholder="Ej. General A">

      <label for="idRepresentante">ID</label>
      <input type="text" id="idRepresentante" placeholder="Ej. FPHS-MX-001">

      <button id="generarGafete">
        Generar vista previa
      </button>

    </div>

    <div class="preview">

      <h2>Vista previa</h2>

      <div class="gafete-wrapper">

        <img
          src="gafete-base.png"
          id="gafeteBase"
          alt="Gafete base"
        >

        <div id="textoNombre" class="dato nombre"></div>
        <div id="textoZona" class="dato zona"></div>
        <div id="textoId" class="dato id"></div>

      </div>

    </div>

  </div>

</div>
  </div>

<script type="module" src="panel.js"></script>
</body>
</html>

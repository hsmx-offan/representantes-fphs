<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Panel Admin | HSMX OFFAN</title>
 <link rel="stylesheet" href="panel.css">

</head>

<body>

  <div class="panel">

    <div id="cargando">
      Verificando acceso...
    </div>

   <div id="contenido">

  <div class="topbar">
    <div>
      <h1>Panel administrativo</h1>
      <p>Generador de gafetes de representantes</p>
    </div>

    <button class="logout" id="logoutButton">
      Cerrar sesión
    </button>
  </div>

  <hr>

  <div class="generador">

    <div class="formulario">

      <h2>Generar gafete</h2>

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Ej. Evelyn Castillo">

      <label for="zona">Zona</label>
      <input type="text" id="zona" placeholder="Ej. General A">

      <label for="idRepresentante">ID</label>
      <input type="text" id="idRepresentante" placeholder="Ej. FPHS-MX-001">

      <button id="generarGafete">
        Generar vista previa
      </button>

    </div>

    <div class="preview">

      <h2>Vista previa</h2>

      <div class="gafete-wrapper">

        <img
          src="gafete-base.png"
          id="gafeteBase"
          alt="Gafete base"
        >

        <div id="textoNombre" class="dato nombre"></div>
        <div id="textoZona" class="dato zona"></div>
        <div id="textoId" class="dato id"></div>

      </div>

    </div>

  </div>

</div>
  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyAesU9F4Oc7Lr8TPOFUk-Oi-lT086XjRKw",

      authDomain:
        "hsmx-representantes.firebaseapp.com",

      projectId:
        "hsmx-representantes",

      storageBucket:
        "hsmx-representantes.firebasestorage.app",

      messagingSenderId:
        "821385801252",

      appId:
        "1:821385801252:web:c95ba9ffdeb90fe03732b1"

    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    const cargando =
      document.getElementById("cargando");

    const contenido =
      document.getElementById("contenido");

    const logoutButton =
      document.getElementById("logoutButton");


    onAuthStateChanged(auth, (user) => {

      if (user) {

        cargando.style.display = "none";

        contenido.style.display = "block";

      } else {

        window.location.href = "./";

      }

    });


    logoutButton.addEventListener(
      "click",
      async () => {

        await signOut(auth);

        window.location.href = "./";

      }
    );
const nombreInput = document.getElementById("nombre");
const zonaInput = document.getElementById("zona");
const idInput = document.getElementById("idRepresentante");

const textoNombre = document.getElementById("textoNombre");
const textoZona = document.getElementById("textoZona");
const textoId = document.getElementById("textoId");

const generarGafete = document.getElementById("generarGafete");

generarGafete.addEventListener("click", () => {

  textoNombre.textContent = nombreInput.value;
  textoZona.textContent = zonaInput.value;
  textoId.textContent = idInput.value;

});
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Panel en mantenimiento
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #fff4f9,
          #f8d7e8
        );

      color: #211820;
    }

    .mantenimiento {
      width: 100%;
      max-width: 620px;

      padding: 42px 30px;

      text-align: center;

      background: rgba(
        255,
        255,
        255,
        0.94
      );

      border: 1px solid
        rgba(
          231,
          43,
          145,
          0.18
        );

      border-radius: 28px;

      box-shadow:
        0 20px 60px
        rgba(
          73,
          31,
          55,
          0.14
        );
    }

    .icono {
      width: 84px;
      height: 84px;

      margin: 0 auto 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 42px;

      background: #fff0f7;

      border-radius: 50%;
    }

    h1 {
      margin: 0 0 14px;

      font-size:
        clamp(
          28px,
          6vw,
          42px
        );

      color: #e72b91;
    }

    p {
      margin: 0 auto;

      max-width: 480px;

      font-size: 17px;
      line-height: 1.6;

      color: #66525f;
    }

    .estado {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      margin-top: 26px;
      padding: 11px 17px;

      font-size: 14px;
      font-weight: bold;

      color: #9b2164;
      background: #ffe6f2;

      border-radius: 999px;
    }

    .punto {
      width: 10px;
      height: 10px;

      background: #e72b91;

      border-radius: 50%;

      animation:
        pulso 1.5s infinite;
    }

    @keyframes pulso {

      0% {
        opacity: 0.35;
        transform: scale(0.85);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }

      100% {
        opacity: 0.35;
        transform: scale(0.85);
      }

    }

  </style>

</head>

<body>

  <main class="mantenimiento">

    <div class="icono">
      🛠️
    </div>

    <h1>
      Panel en mantenimiento
    </h1>

    <p>
      Estamos realizando mejoras en el panel
      administrativo de Harry Styles México OFFAN.
      El acceso volverá a estar disponible próximamente.
    </p>

    <div class="estado">

      <span class="punto"></span>

      Trabajando en las mejoras

    </div>

  </main>

</body>

</html>
